# nginx reverse proxy for the mining dashboard, with HTTPS from Let's Encrypt (certbot).
#
# HTTPS with a domain name is what lets the dashboard offer passkeys; it does its own
# sign-in, so there is no auth_basic here.
#
# 1. Replace mining.example.com (three places) and the upstream address below.
# 2. Copy to /etc/nginx/sites-available/, link into sites-enabled/, then:
#      nginx -t && systemctl reload nginx
#      certbot --nginx -d mining.example.com
#    (certbot fills in the certificate lines; until then, comment out the 443 server block,
#    or use `certbot certonly --webroot -w /var/www/html -d mining.example.com` first.)
# 3. In the stack's .env, choose one:
#      DASHBOARD_TRUST_PROXY=1  only if clients can reach port 8080 solely through this
#                               proxy (firewall it to the nginx host). The dashboard then
#                               rate-limits sign-in per real client and marks cookies Secure.
#      DASHBOARD_TRUST_PROXY=0  if you also open http://<host>:8080 directly (LAN, VPN). The
#                               dashboard ignores X-Forwarded-* so direct clients cannot spoof
#                               them; passkeys still work through this proxy, and the
#                               sign-in rate limit below covers proxied clients.

# The dashboard: DASHBOARD_BIND_ADDRESS:8080, or 127.0.0.1:8080 if nginx runs on the same host.
upstream mining_dashboard {
    server 127.0.0.1:8080;
    keepalive 8;
}

# Extra brake on password and passkey attempts (POSTs to /api/auth/), per real client
# address. GETs (the page checking whether it is signed in) are not limited: an empty key
# is never counted.
map $request_method $mining_signin_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $mining_signin_key zone=mining_signin:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mining.example.com;

    # certbot's HTTP-01 challenge; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "http2" on the listen line works on every nginx version (newer ones warn that it is
    # deprecated; on nginx 1.25.1+ you may use a separate "http2 on;" instead).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mining.example.com;

    ssl_certificate     /etc/letsencrypt/live/mining.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mining.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mining_tls:1m;

    # Browsers only ever use HTTPS for this name, so the session cookie never travels over
    # plain HTTP. includeSubDomains applies this to every subdomain too; drop it if any of
    # them still need plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://mining_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The dashboard compares the browser's Origin with the host it was sent to, and uses
        # the host as the passkey domain, so pass the original Host through.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/auth/ {
        limit_req zone=mining_signin burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://mining_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
