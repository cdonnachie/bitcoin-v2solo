<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Security · Mining Console</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="eyebrow"><a class="back-link" href="./">← MINING CONSOLE</a> · ACCOUNT</p>
        <h1>Security</h1>
      </div>
      <div class="header-state">
        <button type="button" id="sign-out">Sign out</button>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="passkeys-heading">
        <div class="section-heading">
          <div><p class="eyebrow">SIGN-IN</p><h2 id="passkeys-heading">Passkeys</h2></div>
          <form id="add-passkey" class="inline-form" hidden>
            <input id="passkey-name" aria-label="Passkey name" placeholder="Device name, e.g. iPhone" maxlength="60" required>
            <button type="submit">Add a passkey</button>
          </form>
        </div>
        <p id="passkey-note" class="auth-note"></p>
        <div id="passkey-list" class="share-events"></div>
      </section>

      <section class="panel" aria-labelledby="password-heading">
        <div class="section-heading">
          <div><p class="eyebrow">SIGN-IN</p><h2 id="password-heading">Change Password</h2></div>
        </div>
        <form id="password-form" class="auth-form settings-form">
          <input type="text" name="username" value="admin" autocomplete="username" hidden aria-hidden="true">
          <label>Current password<input id="current-password" type="password" autocomplete="current-password" required></label>
          <label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="10" required></label>
          <label>Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" required></label>
          <button type="submit">Change password</button>
          <p class="auth-note">Changing the password signs out every other session.</p>
        </form>
      </section>

      <section class="panel" aria-labelledby="sessions-heading">
        <div class="section-heading">
          <div><p class="eyebrow">SIGN-IN</p><h2 id="sessions-heading">Sessions</h2></div>
          <button type="button" id="sign-out-all">Sign out everywhere</button>
        </div>
        <p class="auth-note">Sessions last 30 days. Forgot the password? Run
          <code>docker exec bitcoin-v2solo-dashboard node reset-password.js</code> on the server.</p>
      </section>

      <p id="settings-message" class="auth-error" role="status"></p>
    </main>
    <script src="passkey.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
